name: kexinglu_mobile
description: "客行录 · 把旅途与日常收进书里"
publish_to: 'none'
version: 1.0.0+32

environment:
  sdk: ^3.13.5

dependencies:
  flutter_localizations:
    sdk: flutter
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  cryptography: ^2.7.0
  geolocator: ^14.1.1
  geocoding: ^4.0.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqflite: ^2.4.4+2
  supabase_flutter: ^2.18.3
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7

dev_dependencies:
  http: ^1.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map/
    - assets/cloud.json
    - assets/quotes.json
    - assets/app.png
    - assets/app-mark.svg
    - assets/backgrounds/
