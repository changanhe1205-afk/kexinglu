name: macOS evaluation build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Core sync tests
        run: python -m unittest discover -s tests -p test_cloud_sync.py
      - name: Build evaluation app
        run: python tools/build_macos.py
      - name: Offline packaged startup
        run: python tools/smoke_macos.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kexinglu-macos-evaluation
          path: |
            dist/Kexinglu-macOS-1.0.0-*-unsigned.zip
            dist/macos-startup.log
          if-no-files-found: error
