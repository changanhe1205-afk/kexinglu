name: Attach verified desktop packages
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag
        required: true
        default: v1.0.0-build31
      windows_source_tag:
        description: Optional published release with unchanged Windows installer
        required: false
        default: ''
      linux_run_id:
        description: Successful Linux desktop build run
        required: true
        default: '39549486390'
jobs:
  attach:
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check successful build and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          RUN: ${{ inputs.linux_run_id }}
        run: |
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq .conclusion)" = success
          test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" = true
      - uses: actions/download-artifact@v4
        with:
          name: kexinglu-linux
          run-id: ${{ inputs.linux_run_id }}
          github-token: ${{ github.token }}
          path: packages
      - name: Attach verified Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: |
          sha256sum packages/*.deb packages/*.tar.gz
          gh release upload "$TAG" packages/*.deb packages/*.tar.gz --repo "$REPO" --clobber
      - name: Reuse unchanged Windows installer
        if: inputs.windows_source_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          SOURCE: ${{ inputs.windows_source_tag }}
        run: |
          test "$(gh release view "$SOURCE" --repo "$REPO" --json isDraft --jq .isDraft)" = false
          gh release download "$SOURCE" --repo "$REPO" --pattern Kexinglu-Setup-1.0.0.exe --dir packages
          gh release upload "$TAG" packages/Kexinglu-Setup-1.0.0.exe --repo "$REPO" --clobber
